<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevKit.lk - Pro UI Component & CSS Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="bodyTag" class="bg-gray-900 text-white min-h-screen transition-colors duration-300 font-sans">

    <!-- Header Section -->
    
    <header class="p-6 border-b border-gray-800 flex justify-between items-center max-w-7xl mx-auto">
        <div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
                DevKit.lk
            </h1>
            <p class="text-xs text-gray-400 mt-1">Pro UI Component & CSS Generator</p>
        </div>
        
        <div class="flex items-center gap-3">
            <!-- අලුතින් දාන About Page Button එක -->
            <a href="about.html" class="px-4 py-2 bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 border border-indigo-500/30 rounded-lg text-sm font-medium transition">
                ℹ️ About & Benefits
            </a>

            <!-- Dark / Light Mode Toggle -->
            <button id="themeToggle" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                <span id="themeIcon">🌙</span>
                <span id="themeText">Dark Mode</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Controls -->
        <section class="lg:col-span-5 space-y-6 bg-gray-800/50 p-6 rounded-2xl border border-gray-700/50 shadow-xl backdrop-blur">
            
            <!-- Component Selector Tabs -->
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Select Component</label>
                <div class="grid grid-cols-3 gap-2 p-1 bg-gray-900/60 rounded-xl border border-gray-700">
                    <button id="tabButton" onclick="switchTab('button')" class="tab-btn py-2 text-sm font-medium rounded-lg bg-indigo-600 text-white transition">Button</button>
                    <button id="tabCard" onclick="switchTab('card')" class="tab-btn py-2 text-sm font-medium rounded-lg text-gray-400 hover:text-white transition">Card</button>
                    <button id="tabBadge" onclick="switchTab('badge')" class="tab-btn py-2 text-sm font-medium rounded-lg text-gray-400 hover:text-white transition">Badge</button>
                </div>
            </div>

            <!-- Controls Form -->
            <div class="space-y-4">
                <!-- Border Radius Slider -->
                <div>
                    <div class="flex justify-between text-sm font-medium mb-1">
                        <span class="text-gray-300">Border Radius</span>
                        <span id="radiusVal" class="text-indigo-400">8px</span>
                    </div>
                    <input type="range" id="radiusInput" min="0" max="50" value="8" class="w-full accent-indigo-500 bg-gray-700 rounded-lg h-2 cursor-pointer">
                </div>

                <!-- Padding Size Slider -->
                <div>
                    <div class="flex justify-between text-sm font-medium mb-1">
                        <span class="text-gray-300">Padding Size</span>
                        <span id="paddingVal" class="text-indigo-400">12px</span>
                    </div>
                    <input type="range" id="paddingInput" min="4" max="40" value="12" class="w-full accent-indigo-500 bg-gray-700 rounded-lg h-2 cursor-pointer">
                </div>

                <!-- Shadow Blur Slider -->
                <div>
                    <div class="flex justify-between text-sm font-medium mb-1">
                        <span class="text-gray-300">Shadow Blur</span>
                        <span id="shadowVal" class="text-indigo-400">15px</span>
                    </div>
                    <input type="range" id="shadowInput" min="0" max="50" value="15" class="w-full accent-indigo-500 bg-gray-700 rounded-lg h-2 cursor-pointer">
                </div>

                <!-- Custom Background Color Picker -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Custom Background Color</label>
                    <div class="flex items-center gap-3">
                        <input type="color" id="bgColorPicker" value="#4f46e5" class="w-10 h-10 rounded-lg cursor-pointer bg-transparent border-0">
                        <span id="colorHexVal" class="text-sm font-mono text-gray-400">#4f46e5</span>
                    </div>
                </div>

                <!-- Preset Color Palettes -->
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Preset Color Themes</label>
                    <div class="flex gap-2">
                        <button onclick="setThemeColor('#4f46e5')" title="Indigo" class="w-8 h-8 rounded-full bg-indigo-600 border-2 border-transparent hover:border-white transition transform hover:scale-110"></button>
                        <button onclick="setThemeColor('#059669')" title="Emerald" class="w-8 h-8 rounded-full bg-emerald-600 border-2 border-transparent hover:border-white transition transform hover:scale-110"></button>
                        <button onclick="setThemeColor('#e11d48')" title="Rose" class="w-8 h-8 rounded-full bg-rose-600 border-2 border-transparent hover:border-white transition transform hover:scale-110"></button>
                        <button onclick="setThemeColor('#d97706')" title="Amber" class="w-8 h-8 rounded-full bg-amber-600 border-2 border-transparent hover:border-white transition transform hover:scale-110"></button>
                        <button onclick="setThemeColor('#9333ea')" title="Purple" class="w-8 h-8 rounded-full bg-purple-600 border-2 border-transparent hover:border-white transition transform hover:scale-110"></button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Right Column: Live Preview & Code Generator -->
        <section class="lg:col-span-7 space-y-6 flex flex-col">
            
            <!-- Live Preview Area -->
            <div class="flex-1 bg-gray-800/30 border border-gray-700/50 rounded-2xl p-8 flex items-center justify-center min-h-[280px] shadow-inner relative overflow-hidden">
                <div id="previewContainer">
                    <button id="previewComponent" class="text-white font-medium shadow-lg transition-all duration-200">
                        Explore Component
                    </button>
                </div>
            </div>

            <!-- Code Mode Switcher & Copy Area -->
            <div class="bg-gray-800/50 p-6 rounded-2xl border border-gray-700/50 shadow-xl space-y-4">
                <div class="flex justify-between items-center">
                    <div class="flex gap-2 p-1 bg-gray-900/60 rounded-lg border border-gray-700">
                        <button id="modeCss" onclick="setMode('css')" class="px-3 py-1 text-xs font-semibold rounded-md bg-indigo-600 text-white transition">CSS</button>
                        <button id="modeTailwind" onclick="setMode('tailwind')" class="px-3 py-1 text-xs font-semibold rounded-md text-gray-400 hover:text-white transition">Tailwind</button>
                    </div>

                    <button id="copyBtn" onclick="copyCode()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg flex items-center gap-1.5 transition">
                        📋 Copy Code
                    </button>
                </div>

                <pre class="bg-gray-950 p-4 rounded-xl text-emerald-400 font-mono text-xs overflow-x-auto border border-gray-800"><code id="codeOutput">/* Generated CSS will appear here */</code></pre>
            </div>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
