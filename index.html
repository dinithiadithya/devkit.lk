<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevKit.lk - Pro UI Component & CSS Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-6 md:p-12">

    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-10">
            <span class="px-3 py-1 text-xs font-semibold text-indigo-400 bg-indigo-500/15 border border-indigo-500/30 rounded-full uppercase tracking-wider">WhiteCoder Intern Challenge 2026</span>
            <h1 class="text-4xl font-extrabold text-white mt-3 tracking-tight">DevKit<span class="text-indigo-500">.lk</span></h1>
            <p class="text-slate-400 mt-2 text-sm md:text-base">An advanced UI component design token and CSS generator crafted for developers & designers.</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <div class="designer-card p-6 md:p-8 rounded-3xl space-y-6">
                <div class="flex items-center justify-between border-b border-slate-700/60 pb-4">
                    <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span> Component Controls
                    </h2>
                    <span class="text-xs text-slate-400">Interactive</span>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 tracking-wider mb-2">Select Component</label>
                    <div class="grid grid-cols-3 gap-2 p-1 bg-slate-900/60 rounded-xl border border-slate-700/50">
                        <button id="tabBtn" class="tab-btn active py-2 text-xs font-semibold rounded-lg text-slate-300 transition cursor-pointer">Button</button>
                        <button id="tabCard" class="tab-btn py-2 text-xs font-semibold rounded-lg text-slate-300 transition cursor-pointer">Card</button>
                        <button id="tabBadge" class="tab-btn py-2 text-xs font-semibold rounded-lg text-slate-300 transition cursor-pointer">Badge</button>
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between text-sm">
                        <label class="font-medium text-slate-300">Border Radius</label>
                        <span class="text-indigo-400 font-mono font-semibold"><span id="radiusVal">12</span>px</span>
                    </div>
                    <input type="range" id="radiusRange" min="0" max="50" value="12" class="w-full">
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between text-sm">
                        <label class="font-medium text-slate-300">Padding Size</label>
                        <span class="text-indigo-400 font-mono font-semibold"><span id="paddingVal">16</span>px</span>
                    </div>
                    <input type="range" id="paddingRange" min="8" max="32" value="16" class="w-full">
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between text-sm">
                        <label class="font-medium text-slate-300">Shadow Blur</label>
                        <span class="text-indigo-400 font-mono font-semibold"><span id="shadowVal">15</span>px</span>
                    </div>
                    <input type="range" id="shadowRange" min="0" max="40" value="15" class="w-full">
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-medium text-slate-300">Background Color</label>
                    <div class="flex items-center gap-3">
                        <input type="color" id="bgColor" value="#6366f1" class="w-12 h-12 rounded-xl">
                        <span class="text-xs text-slate-400">Click to pick custom color</span>
                    </div>
                </div>
            </div>

            <div class="flex flex-col space-y-6">
                <div class="designer-card p-6 md:p-8 rounded-3xl flex flex-col items-center justify-center flex-grow min-h-[240px] relative overflow-hidden">
                    <div class="absolute top-4 left-4 flex items-center gap-1.5">
                        <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
                    </div>
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-6 mt-2">Live Preview Area</span>
                    
                    <div id="previewContainer" class="flex items-center justify-center">
                        <button id="previewBtn" class="text-white font-semibold transition-all duration-200 cursor-pointer active:scale-95">
                            Explore Component
                        </button>
                    </div>
                </div>

                <div class="designer-card p-6 rounded-3xl">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                            Generated Code
                        </span>
                        
                        <div class="flex gap-2">
                            <button id="modeCss" class="mode-btn active px-2.5 py-1 text-xs font-semibold rounded-lg text-slate-300 cursor-pointer">CSS</button>
                            <button id="modeTailwind" class="mode-btn px-2.5 py-1 text-xs font-semibold rounded-lg text-slate-300 cursor-pointer">Tailwind</button>
                            <button id="copyBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3.5 py-1.5 rounded-xl font-semibold transition shadow-lg shadow-indigo-600/30 cursor-pointer">Copy Code</button>
                        </div>
                    </div>
                    <pre class="bg-slate-950/80 p-4 rounded-2xl text-emerald-400 font-mono text-xs overflow-x-auto border border-slate-800/80"><code id="codeOutput"></code></pre>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
